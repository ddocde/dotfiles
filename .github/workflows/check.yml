name: check
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n setup.sh lib/*.sh modules/*/*.sh scripts/*.sh tests/*.sh
      - run: shellcheck setup.sh lib/*.sh modules/*/*.sh scripts/*.sh tests/*.sh
      - run: ./tests/run.sh
